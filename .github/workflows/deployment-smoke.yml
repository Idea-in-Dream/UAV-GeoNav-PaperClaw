name: UAV GeoNav Deployment Smoke

on:
  workflow_dispatch:

concurrency:
  group: uav-geonav-deployment-smoke
  cancel-in-progress: false

jobs:
  end-to-end:
    name: "Pipeline / ${{ vars.LLM_MODEL || 'deepseek-v4-flash' }} / thinking=${{ vars.LLM_THINKING_MODE || 'enabled' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.UAV_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      RS_GITHUB_REPO: ${{ vars.RS_GITHUB_REPO || github.repository }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_THINKING_MODE: ${{ vars.LLM_THINKING_MODE }}
      LLM_API_URL: ${{ vars.LLM_API_URL }}
      GITHUB_TIMEOUT: ${{ vars.GITHUB_TIMEOUT }}
      GITHUB_RETRY: ${{ vars.GITHUB_RETRY }}
      ARXIV_API_URL: ${{ vars.ARXIV_API_URL }}
      ARXIV_USER_AGENT: ${{ vars.ARXIV_USER_AGENT }}
      RS_FILTER_KEYWORDS_FILE: scripts/config/filter_keywords.json
      RS_FILTER_PROMPT_FILE: scripts/prompts/filter_cross_prompt.md
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout pipeline files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            skills/rs-paper-pipeline
            papers/issue_index.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        working-directory: skills/rs-paper-pipeline
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Repair existing issue format
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/cli.py repair-issues

      - name: Doctor
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/cli.py doctor

      - name: Ensure issue labels
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/cli.py setup-labels

      - name: Run end-to-end smoke date
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/cli.py run --date 20260722 --no-notify

      - name: Assert idempotent smoke result
        working-directory: skills/rs-paper-pipeline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")

          from clients.github_ops import extract_arxiv_id_from_issue
          from pipeline_config import get_repo, load_config
          from services.issue_index import canonical_arxiv_id

          state = json.loads(Path("memory/pipeline_state/20260722.json").read_text(encoding="utf-8"))
          assert state.get("status") == "skipped", state
          assert "digest=#3 papers=2" in state.get("skip_reason", ""), state

          repo = get_repo(load_config())
          issues = list(repo.get_issues(state="all"))
          expected_ids = {"2607.20116", "2607.19951"}
          counts = {arxiv_id: 0 for arxiv_id in expected_ids}
          digest_count = 0
          for issue in issues:
              if issue.title.strip() == "日报 20260722":
                  digest_count += 1
              arxiv_id = extract_arxiv_id_from_issue(issue)
              if arxiv_id:
                  canonical = canonical_arxiv_id(arxiv_id)
                  if canonical in counts:
                      counts[canonical] += 1

          assert digest_count == 1, {"digest_count": digest_count}
          assert counts == {"2607.20116": 1, "2607.19951": 1}, counts
          print("IDEMPOTENCY_OK", counts, "digest_count=1")
          PY

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uav-geonav-deployment-smoke-runtime
          path: skills/rs-paper-pipeline/memory/
